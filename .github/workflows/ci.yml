name: FUF Sovereign Defense CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-build:
    name: 30-Vector Sovereign Cryptographic Audit & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Execute 30-Vector Apex Sovereign Audit (142 Tests)
        run: npx tsx tests/engine_test_suite.ts

      - name: Execute RFC 8484 Mobile LAN DoH Audit
        run: npx tsx tests/test_mobile_doh.ts

      - name: Build Production Extension & Daemon Bundles
        run: npm run build
