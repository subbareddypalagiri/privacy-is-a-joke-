name: FUF Sovereign Defense CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-build:
    name: 45-Vector Sovereign Audit & Extension Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Execute 45-Vector Apex Iceberg Audit (208 Tests)
        run: npx tsx tests/engine_test_suite.ts

      - name: Execute RFC 8484 Mobile LAN DoH Audit
        run: npx tsx tests/test_mobile_doh.ts

      - name: Build Production Extension & Daemon Bundles
        run: npm run build

      - name: Upload Web & Browser Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuf-extension-bundle-v1.0.0
          path: dist/
          retention-days: 14

  build-android-apk:
    name: Native Android APK Cloud Compiler
    needs: audit-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Bundle & Sync Capacitor Android
        run: npm run mobile:build

      - name: Setup Java JDK (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Compile Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Native Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FUF-Sovereign-Android-v1.0.0-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  build-windows-exe:
    name: Windows Electron Desktop Executable Compiler
    needs: audit-and-build
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Production UI & Daemon Bundles
        run: npm run build

      - name: Package Windows Desktop App (NSIS Installer & Portable EXE)
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Desktop Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FUF-Sovereign-Windows-Desktop-v1.0.0
          path: dist_installer/*.exe
          retention-days: 30
